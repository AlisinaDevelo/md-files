name: CI

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate toolkit structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Validate frontmatter, JSON, and hook scripts
        run: ./scripts/validate.sh

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@29e1992fd532969762382607bd9acb1a05aa4dc8 # v24
        with:
          globs: "**/*.md"
          config: .markdownlint.yaml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: .
          format: gcc
          severity: warning

  test:
    name: Hook tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Install pytest
        run: pip install pytest
      - name: Run hook tests
        run: pytest tests/ -v

  evals:
    name: Prompt-quality evals (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Run static prompt-quality eval
        run: python3 evals/run.py
      - name: Run deterministic cross-host conformance
        run: python3 evals/run_scenarios.py --adapter all --no-receipts --output "$RUNNER_TEMP/forge-scenario-results.json"
      - name: Run portable backend conformance
        run: python3 plugins/forge/skills/orchestration/scripts/forge-backends.py conformance --backend all > "$RUNNER_TEMP/forge-backend-conformance.json"
      - name: Run bounded deterministic chaos corpus
        run: python3 plugins/forge/skills/orchestration/scripts/forge-chaos.py corpus --output "$RUNNER_TEMP/forge-chaos-corpus.json"
      - name: Upload conformance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-conformance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/forge-scenario-results.json
            ${{ runner.temp }}/forge-backend-conformance.json
            ${{ runner.temp }}/forge-chaos-corpus.json
          if-no-files-found: error
          retention-days: 14

  gh-aw-native:
    name: Pinned gh-aw native compiler
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Install the pinned gh-aw extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-aw --pin v0.85.4
          version="$(gh aw version 2>&1)"
          case "$version" in
            v0.85.4|"gh aw version v0.85.4") ;;
            *) exit 1 ;;
          esac
      - name: Compile, verify, and reproduce native locks without dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/forge-gh-aw-native-first"
          second="$RUNNER_TEMP/forge-gh-aw-native-second"
          for output in "$first" "$second"; do
            python3 scripts/forge-gh-aw.py compile \
              --spec data/gh-aw-workflows.json \
              --output "$output" \
              --upstream
            python3 scripts/forge-gh-aw.py check \
              --spec data/gh-aw-workflows.json \
              --output "$output"
            test "$(find "$output/workflows" -name '*.lock.yml' -type f | wc -l | tr -d ' ')" = "5"
          done
          diff -ru "$first" "$second"

  python-lint:
    name: Hook scripts (ruff + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Compile hook, skill, eval, and test scripts
        run: python -m py_compile plugins/forge/hooks/scripts/*.py plugins/forge/skills/*/scripts/*.py scripts/*.py evals/*.py tests/*.py
      - name: Lint with ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check plugins/forge/hooks/scripts plugins/forge/skills/policy/scripts plugins/forge/skills/stacked-changes/scripts plugins/forge/skills/doctor/scripts plugins/forge/skills/observability/scripts plugins/forge/skills/task-ledger/scripts plugins/forge/skills/orchestration/scripts scripts/build_release.py scripts/forge-attestation.py scripts/forge-trajectory-evals.py scripts/forge-authority.py scripts/forge-host-admission.py scripts/forge-a2a-card.py scripts/forge-a2a-task.py scripts/build_openai_submission_evidence.py scripts/compile_capabilities.py scripts/render_capabilities.py scripts/diff_capabilities.py scripts/migrate_capabilities.py scripts/validate_codex_plugin.py scripts/verify_release.py scripts/generate_catalog.py scripts/forge-doctor.py scripts/forge-policy.py scripts/forge-receipts.py scripts/forge-runtime.py scripts/forge-lineage.py scripts/forge-provenance.py scripts/forge-gh-aw.py scripts/forge-gh-aw-provider.py scripts/forge-tasks.py scripts/forge-stack-sync.py evals tests

  release-package:
    name: Reproducible release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Build the package twice from one commit
        id: package
        env:
          FIRST_DIR: ${{ runner.temp }}/forge-dist-first
          SECOND_DIR: ${{ runner.temp }}/forge-dist-second
        run: |
          set -euo pipefail
          version="$(jq -r '.version' plugins/forge/.claude-plugin/plugin.json)"
          epoch="$(git show -s --format=%ct HEAD)"
          mkdir "$FIRST_DIR" "$SECOND_DIR"
          python3 scripts/build_release.py --output "$FIRST_DIR" --version "$version" --source-date-epoch "$epoch"
          python3 scripts/build_release.py --output "$SECOND_DIR" --version "$version" --source-date-epoch "$epoch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify both package directories offline
        env:
          FIRST_DIR: ${{ runner.temp }}/forge-dist-first
          SECOND_DIR: ${{ runner.temp }}/forge-dist-second
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          python3 scripts/verify_release.py \
            --manifest "$FIRST_DIR/forge-$VERSION-manifest.json" \
            --root "$FIRST_DIR" \
            --version "$VERSION" \
            --commit "$commit"
          python3 scripts/verify_release.py \
            --manifest "$SECOND_DIR/forge-$VERSION-manifest.json" \
            --root "$SECOND_DIR" \
            --version "$VERSION" \
            --commit "$commit"
      - name: Verify Forge DSSE/SLSA contract offline
        env:
          FIRST_DIR: ${{ runner.temp }}/forge-dist-first
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/forge-attestation.py self-test \
            --manifest "$FIRST_DIR/forge-$VERSION-manifest.json" \
            --root "$FIRST_DIR" \
            --policy policies/release.json \
            --source-ref "refs/heads/${GITHUB_REF_NAME}" \
            --json \
            | jq -e '.status == "passed" and (.profiles | length) == 2 and (.negative_cases | length) == 6 and all(.profiles[]; .status == "verified") and all(.negative_cases[]; .status == "pass")'
      - name: Verify trajectory security corpus offline
        run: |
          set -euo pipefail
          python3 scripts/forge-trajectory-evals.py evaluate \
            --corpus tests/fixtures/trajectories/v1.jsonl --json \
            | jq -e '.status == "passed" and .case_count == 4 and .threat_cases == 2 and .judge.release_oracle == "deterministic"'
      - name: Verify identity and delegated authority corpus offline
        run: |
          set -euo pipefail
          python3 scripts/forge-authority.py evaluate \
            --corpus tests/fixtures/authority/v1.jsonl --json \
            | jq -e '.status == "passed" and .case_count == 11 and .threat_cases == 5 and .deterministic == true'
      - name: Verify host admission corpus offline
        run: |
          set -euo pipefail
          python3 scripts/forge-host-admission.py evaluate \
            --corpus tests/fixtures/host-admission/v1.jsonl --json \
            | jq -e '.status == "passed" and .case_count == 2 and .threat_cases == 1 and .deterministic == true'
      - name: Verify A2A Agent Card corpus offline
        run: |
          set -euo pipefail
          python3 scripts/forge-a2a-card.py evaluate \
            --corpus tests/fixtures/a2a-card/v1.jsonl --json \
            | jq -e '.status == "passed" and .case_count == 4 and .threat_cases == 3 and .deterministic == true'
      - name: Verify A2A task handoff corpus offline
        run: |
          set -euo pipefail
          python3 scripts/forge-a2a-task.py evaluate \
            --corpus tests/fixtures/a2a-task/v1.jsonl --json \
            | jq -e '.status == "passed" and .case_count == 8 and .threat_cases == 5 and .deterministic == true'
      - name: Compare every generated byte
        env:
          FIRST_DIR: ${{ runner.temp }}/forge-dist-first
          SECOND_DIR: ${{ runner.temp }}/forge-dist-second
        run: |
          set -euo pipefail
          for artifact in "$FIRST_DIR"/*; do
            name="$(basename "$artifact")"
            cmp "$artifact" "$SECOND_DIR/$name"
          done

  plugin-manifest:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate plugin + marketplace JSON
        run: |
          jq empty plugins/forge/.claude-plugin/plugin.json && echo "plugin.json OK"
          jq empty plugins/forge/.codex-plugin/plugin.json && echo "Codex plugin.json OK"
          jq empty .claude-plugin/marketplace.json && echo "marketplace.json OK"
          jq empty .agents/plugins/marketplace.json && echo "Codex marketplace.json OK"
          jq -e '.name' plugins/forge/.claude-plugin/plugin.json > /dev/null \
            && echo "plugin.json has required name field"
          jq -e '.name and .owner and .plugins' .claude-plugin/marketplace.json > /dev/null \
            && echo "marketplace.json has required fields"

  host-validation:
    name: Host and Agent Skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate Agent Skills format
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' skill; do
            npx --yes skills-ref@0.1.5 validate "$skill"
          done < <(find plugins/forge/skills -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
      - name: Install host CLIs from lockfile
        working-directory: .github/host-cli
        run: |
          set -euo pipefail
          npm ci
          echo "$GITHUB_WORKSPACE/.github/host-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate Claude plugin strictly
        run: claude plugin validate --strict plugins/forge
      - name: Validate the exact release candidate archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' plugins/forge/.claude-plugin/plugin.json)"
          candidate="$(mktemp -d "$RUNNER_TEMP/forge-codex-candidate.XXXXXX")"
          mkdir "$candidate/dist"
          epoch="$(git show -s --format=%ct HEAD)"
          python3 scripts/build_release.py \
            --output "$candidate/dist" \
            --version "$version" \
            --source-date-epoch "$epoch"
          python3 scripts/validate_codex_plugin.py \
            --archive "$candidate/dist/forge-$version-codex.tar.gz" \
            --version "$version"
          python3 scripts/validate_codex_plugin.py \
            --marketplace .agents/plugins/marketplace.json \
            --root .
          python3 scripts/build_openai_submission_evidence.py \
            --output "$candidate/openai-agent-plugin-submission.json"
          tar -xzf "$candidate/dist/forge-$version-claude.tar.gz" -C "$candidate"
          claude plugin validate --strict "$candidate/forge"
      - name: Upload OpenAI submission evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-openai-agent-plugin-submission-${{ github.run_id }}
          path: ${{ runner.temp }}/**/openai-agent-plugin-submission.json
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test isolated host marketplace lifecycle
        run: ./scripts/marketplace-smoke.sh "$GITHUB_WORKSPACE"
      - name: Smoke-test Codex marketplace resolution
        env:
          CODEX_MARKETPLACE_SOURCE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          codex plugin marketplace add "$CODEX_MARKETPLACE_SOURCE" --json
          codex plugin list --available --json \
            | jq -e 'any((.installed // [])[]?; .name == "forge") or any((.available // [])[]?; .name == "forge")'

  scorecard:
    name: OpenSSF Scorecard
    permissions:
      contents: read
      id-token: write # Required by Scorecard to publish signed results
      security-events: write # Required to upload the Scorecard SARIF report
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
